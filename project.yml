name: Orion
options:
  bundleIdPrefix: com.orion
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

targets:
  Orion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Orion
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Orion/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orion.app
        INFOPLIST_FILE: Orion/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Orion/Resources/Orion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    entitlements:
      path: Orion/Resources/Orion.entitlements
    info:
      path: Orion/Resources/Info.plist
      properties:
        CFBundleName: Orion
        CFBundleDisplayName: Orion
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundlePackageType: APPL
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts: []
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        NSUserNotificationsUsageDescription: "Orion uses notifications to remind you to log your daily habits and celebrate streak milestones."
